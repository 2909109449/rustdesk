name: Build Qianxi(RustDesk)

# 复用官方 flutter-build.yml（原样保留官方 Windows/Linux/macOS 打包流程），只多一步品牌补丁。
on:
  workflow_dispatch:
    inputs:
      qianxi_app_name:
        description: '显示名称'
        required: true
        default: 'Qianxi(RustDesk)'
      qianxi_id_server:
        description: 'ID 服务器'
        required: true
      qianxi_relay_server:
        description: '中继服务器'
        required: true
      qianxi_api_server:
        description: 'API 服务器（https://...）'
        required: true
      qianxi_public_key:
        description: '服务器公钥'
        required: true

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: qianxi-build
      qianxi_app_name: ${{ inputs.qianxi_app_name }}
      qianxi_id_server: ${{ inputs.qianxi_id_server }}
      qianxi_relay_server: ${{ inputs.qianxi_relay_server }}
      qianxi_api_server: ${{ inputs.qianxi_api_server }}
      qianxi_public_key: ${{ inputs.qianxi_public_key }}
    secrets: inherit
